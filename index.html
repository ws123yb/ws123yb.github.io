<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGC 实时看板</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0b0e13; color: #e8ecf1; padding: 20px 16px 40px;
    max-width: 560px; margin: 0 auto;
  }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 2px; }
  .sub { color: #8a94a3; font-size: 12px; margin-bottom: 18px; }
  .price-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .price { font-size: 40px; font-weight: 800; letter-spacing: -0.5px; transition: color .3s; }
  .price small { font-size: 18px; color: #8a94a3; font-weight: 600; }
  .tick { font-size: 22px; font-weight: 800; }
  /* A股惯例：红涨绿跌 */
  .up { color: #ff4d4f; } .down { color: #2ecc71; }
  .live-badge {
    font-size: 15px; font-weight: 700; padding: 4px 10px; border-radius: 8px; background: #171c26;
  }
  .chg { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 16px; }
  .chg span {
    font-size: 12px; padding: 4px 9px; border-radius: 20px; background: #171c26;
  }
  .chartbox { background: #141922; border: 1px solid #232b38; border-radius: 14px; padding: 12px 14px 8px; margin-bottom: 14px; }
  .chartbox .chead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .chartbox .ctitle { font-size: 13px; color: #c6cedb; }
  .chartbox .cpct { font-size: 18px; font-weight: 800; }
  .chartbox .cmeta { font-size: 11px; color: #5c6675; margin-top: 4px; }
  #chart { width: 100%; height: 110px; display: block; }
  .card {
    background: #141922; border: 1px solid #232b38; border-radius: 14px;
    padding: 14px 16px; margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .card .amt { font-size: 15px; color: #c6cedb; }
  .card .amt b { color: #fff; font-size: 17px; }
  .card .val { text-align: right; }
  .card .val .gross { font-size: 20px; font-weight: 700; }
  .card .val .net { font-size: 12px; color: #8a94a3; }
  .stats { display: flex; gap: 16px; flex-wrap: wrap; margin: 16px 0 6px; color: #8a94a3; font-size: 12px; }
  .calc { background: #141922; border: 1px solid #232b38; border-radius: 14px; padding: 14px 16px; margin-top: 16px; }
  .calc label { font-size: 13px; color: #c6cedb; display: block; margin-bottom: 8px; }
  .calc input {
    width: 100%; background: #0b0e13; border: 1px solid #2a3342; border-radius: 10px;
    color: #fff; font-size: 18px; padding: 10px 12px; outline: none;
  }
  .calc .out { margin-top: 10px; font-size: 15px; }
  .calc .out b { font-size: 19px; }
  .foot { color: #5c6675; font-size: 11px; margin-top: 22px; line-height: 1.7; }
  .err { color: #ff5c5c; }
  .bsec-title { font-size: 16px; font-weight: 700; margin: 20px 0 4px; }
  .bsec-sub { color: #8a94a3; font-size: 12px; margin-bottom: 10px; }
  .bacct { background: #141922; border: 1px solid #232b38; border-radius: 14px; padding: 13px 16px; margin-bottom: 10px; }
  .bacct .bhead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .bacct .bname { font-size: 15px; font-weight: 700; }
  .bacct .bshares { font-size: 12px; color: #8a94a3; }
  .brow { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; color: #c6cedb; }
  .brow b { color: #fff; font-weight: 600; }
  .brow .usd { color: #8a94a3; font-size: 12px; margin-left: 6px; }
  .bbar { height: 6px; background: #0b0e13; border-radius: 3px; margin: 8px 0 4px; overflow: hidden; }
  .bbar i { display: block; height: 100%; background: #f5a623; border-radius: 3px; }
  .btot { background: #171c26; border: 1px solid #2a3342; border-radius: 14px; padding: 13px 16px; margin-bottom: 10px; font-size: 14px; }
  .btot b { font-size: 16px; }
</style>
</head>
<body>
  <h1>AGC · Agentic Coin</h1>
  <div class="sub">BSC / PancakeSwap 实时行情 · 每 30 秒自动刷新 · 红涨绿跌</div>

  <div class="price-row">
    <div class="price" id="price">加载中…</div>
    <div class="tick" id="tick"></div>
    <div class="live-badge" id="liveBadge"></div>
  </div>
  <div class="chg" id="chg"></div>

  <div class="chartbox">
    <div class="chead">
      <div class="ctitle">实时涨幅线（近 2 小时 · 每 30 秒一个点）</div>
      <div class="cpct" id="chartPct"></div>
    </div>
    <canvas id="chart"></canvas>
    <div class="cmeta" id="chartMeta"></div>
  </div>

  <div id="cards"></div>

  <div class="bsec-title">B 类仓位（mintPool）</div>
  <div class="bsec-sub">奖励 14 天线性解锁 · 数据直读链上铸造合约</div>
  <div id="bsec"><div class="bacct">加载中…</div></div>

  <div class="stats" id="stats"></div>

  <div class="calc">
    <label>自己算：输入 AGC 数量</label>
    <input id="custom" type="number" inputmode="decimal" placeholder="例如 700000">
    <div class="out" id="customOut"></div>
  </div>

  <div class="foot" id="foot">
    价格来源 DexScreener 公开行情（AGC/WBNB 主池）。「卖出到手」按 2% 卖出税估算，未计滑点。<br>
    <span id="upd"></span>
  </div>

<script>
const TOKEN = "0x63dea5aCdbE1F27c968907D08610A5f0A0284bA6";
const PRESETS = [
  { n: 700000, label: "700,000 枚" },
  { n: 140000, label: "140,000 枚" },
  { n: 70000,  label: "70,000 枚（第 3 纪元一份）" },
  { n: 35000,  label: "35,000 枚（第 4 纪元一份）" },
];
const UP = "#ff4d4f", DOWN = "#2ecc71"; // 红涨绿跌
let price = null, prevPrice = null, sessionBase = null;
let hist = [];
try { hist = JSON.parse(localStorage.getItem("agc_hist") || "[]"); } catch (e) { hist = []; }

function fmtUSD(v) {
  if (v == null || isNaN(v)) return "—";
  return "$" + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtPrice(p) {
  if (p == null || isNaN(p)) return "—";
  return "$" + p.toFixed(8).replace(/0+$/, "").replace(/\.$/, "");
}
function pctTxt(v) { return (v >= 0 ? "+" : "") + v.toFixed(2) + "%"; }
function chgHTML(label, v) {
  if (v == null || isNaN(v)) return "";
  const cls = v >= 0 ? "up" : "down";
  const arrow = v >= 0 ? "▲" : "▼";
  return `<span>${label} <b class="${cls}">${arrow} ${pctTxt(v)}</b></span>`;
}
function render() {
  if (price == null) return;
  document.getElementById("cards").innerHTML = PRESETS.map(p => {
    const gross = p.n * price, net = gross * 0.98;
    return `<div class="card">
      <div class="amt"><b>${p.label}</b></div>
      <div class="val"><div class="gross">${fmtUSD(gross)}</div>
      <div class="net">卖出到手 ≈ ${fmtUSD(net)}</div></div>
    </div>`;
  }).join("");
  const c = parseFloat(document.getElementById("custom").value);
  const out = document.getElementById("customOut");
  if (!isNaN(c) && c > 0) {
    const gross = c * price;
    out.innerHTML = `毛值 <b>${fmtUSD(gross)}</b> · 卖出到手 ≈ <b>${fmtUSD(gross * 0.98)}</b>`;
  } else out.innerHTML = "";
}
function drawChart() {
  const cv = document.getElementById("chart");
  const pctEl = document.getElementById("chartPct");
  const metaEl = document.getElementById("chartMeta");
  if (hist.length < 2) { pctEl.textContent = ""; metaEl.textContent = "正在积累数据点，下一轮刷新后出现涨幅线…"; const x = cv.getContext("2d"); x.clearRect(0,0,cv.width,cv.height); return; }
  const base = hist[0].p;
  const pts = hist.map(h => (h.p - base) / base * 100);
  const last = pts[pts.length - 1];
  const col = last >= 0 ? UP : DOWN;
  pctEl.textContent = (last >= 0 ? "▲ " : "▼ ") + pctTxt(last);
  pctEl.style.color = col;
  const t0 = new Date(hist[0].t), t1 = new Date(hist[hist.length - 1].t);
  const f = d => d.toLocaleTimeString("zh-CN", { hour12: false, hour: "2-digit", minute: "2-digit" });
  metaEl.textContent = `${f(t0)} 起算 · 最高 ${pctTxt(Math.max(...pts))} · 最低 ${pctTxt(Math.min(...pts))} · 共 ${pts.length} 个点`;
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== W * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
  const x = cv.getContext("2d");
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.clearRect(0, 0, W, H);
  let min = Math.min(0, ...pts), max = Math.max(0, ...pts);
  if (max - min < 0.1) { max += 0.05; min -= 0.05; }
  const pad = (max - min) * 0.12; max += pad; min -= pad;
  const X = i => i / (pts.length - 1) * (W - 8) + 4;
  const Y = v => H - (v - min) / (max - min) * H;
  // 零线
  x.strokeStyle = "rgba(255,255,255,.25)"; x.setLineDash([4, 4]); x.beginPath();
  x.moveTo(0, Y(0)); x.lineTo(W, Y(0)); x.stroke(); x.setLineDash([]);
  // 填充
  x.beginPath();
  pts.forEach((v, i) => i ? x.lineTo(X(i), Y(v)) : x.moveTo(X(i), Y(v)));
  x.lineTo(X(pts.length - 1), Y(min)); x.lineTo(X(0), Y(min)); x.closePath();
  x.fillStyle = col + "2e"; x.fill();
  // 线
  x.beginPath();
  pts.forEach((v, i) => i ? x.lineTo(X(i), Y(v)) : x.moveTo(X(i), Y(v)));
  x.strokeStyle = col; x.lineWidth = 2; x.lineJoin = "round"; x.stroke();
  // 末点
  x.beginPath(); x.arc(X(pts.length - 1), Y(last), 3.5, 0, 7); x.fillStyle = col; x.fill();
}
async function load() {
  try {
    const r = await fetch("https://api.dexscreener.com/latest/dex/tokens/" + TOKEN);
    const j = await r.json();
    const pairs = (j.pairs || []).filter(p => p.chainId === "bsc");
    if (!pairs.length) throw new Error("no pair");
    pairs.sort((a, b) => (b.liquidity?.usd || 0) - (a.liquidity?.usd || 0));
    const p = pairs[0];
    prevPrice = price;
    price = parseFloat(p.priceUsd);
    if (sessionBase == null) sessionBase = price;
    // 价格本体 + 跳动方向箭头（红涨绿跌，颜色停留到下一轮）
    const priceEl = document.getElementById("price");
    priceEl.innerHTML = fmtPrice(price) + " <small>USD</small>";
    const tickEl = document.getElementById("tick");
    if (prevPrice != null && price !== prevPrice) {
      const upTick = price > prevPrice;
      priceEl.style.color = upTick ? UP : DOWN;
      tickEl.textContent = upTick ? "▲" : "▼";
      tickEl.style.color = upTick ? UP : DOWN;
    }
    // 本次打开以来的实时涨跌徽标
    const sess = (price - sessionBase) / sessionBase * 100;
    const badge = document.getElementById("liveBadge");
    badge.textContent = "打开以来 " + (sess >= 0 ? "▲ " : "▼ ") + pctTxt(sess);
    badge.style.color = sess >= 0 ? UP : DOWN;
    // 涨幅线采样（存本地，保留近 2 小时）
    const now = Date.now();
    if (!hist.length || hist[hist.length - 1].p !== price) hist.push({ t: now, p: price });
    hist = hist.filter(h => now - h.t <= 2 * 3600 * 1000);
    if (hist.length > 240) hist = hist.slice(hist.length - 240);
    try { localStorage.setItem("agc_hist", JSON.stringify(hist)); } catch (e) {}
    drawChart();
    const pc = p.priceChange || {};
    document.getElementById("chg").innerHTML =
      chgHTML("5 分钟", pc.m5) + chgHTML("1 小时", pc.h1) + chgHTML("6 小时", pc.h6) + chgHTML("24 小时", pc.h24);
    const bnb = price / parseFloat(p.priceNative);
    document.getElementById("stats").innerHTML =
      `<span>24h 成交量 ${fmtUSD(p.volume?.h24)}</span>` +
      `<span>池子流动性 ${fmtUSD(p.liquidity?.usd)}</span>` +
      `<span>BNB ≈ ${fmtUSD(bnb)}</span>`;
    document.getElementById("upd").textContent =
      "更新于 " + new Date().toLocaleTimeString("zh-CN", { hour12: false });
    render();
  } catch (e) {
    document.getElementById("price").innerHTML = '<span class="err">行情拉取失败，稍后自动重试</span>';
  }
}
// ---------- B 类仓位（链上直读 mintPool 仓位） ----------
const MINTER = "0x6288DFe86f22B53eEB6886aE2D78941de7483743";
const LOCK_SEC = 1209600; // 14 天
const B_ACCOUNTS = [
  { name: "1号 zjws.ai", addr: "0xc4979b2cEC8185974eBE09a1B2202D201a7c1303" },
  { name: "2号 haishijie.ai", addr: "0x5B9a561EdEceD301644f4bA9eD312c983C31bd4a" },
  { name: "3号 xiaokw.ai", addr: "0xe45dACfc06dcE4d885a0ef95e713adAF01a0ef16" },
];
const BSC_RPCS = ["https://bsc.publicnode.com", "https://bsc-rpc.publicnode.com", "https://bsc-dataseed.bnbchain.org"];
function pad64(x) {
  if (typeof x === "number") x = x.toString(16);
  return String(x).toLowerCase().replace("0x", "").padStart(64, "0");
}
async function ethCall(to, data) {
  for (const url of BSC_RPCS) {
    try {
      const r = await fetch(url, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "eth_call", params: [{ to, data }, "latest"] })
      });
      const j = await r.json();
      if (j.result) return j.result;
    } catch (e) { /* try next RPC */ }
  }
  throw new Error("rpc failed");
}
function hexWords(hex) {
  const h = hex.replace("0x", "");
  const out = [];
  for (let i = 0; i + 64 <= h.length; i += 64) out.push(BigInt("0x" + h.slice(i, i + 64)));
  return out;
}
const fmtAGC = v => Math.round(v).toLocaleString("en-US");
function fmtDT(ts) {
  return new Date(ts * 1000).toLocaleString("zh-CN", { hour12: false, month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
}
async function loadB() {
  const sec = document.getElementById("bsec");
  try {
    const now = Math.floor(Date.now() / 1000);
    let totReward = 0, totClaimable = 0, totShares = 0;
    const blocks = [];
    for (const a of B_ACCOUNTS) {
      const data = "0x65e1ebbb" + pad64(a.addr) + pad64(0) + pad64(50); // poolPositions(addr,0,50)
      const w = hexWords(await ethCall(MINTER, data));
      const len = Number(w[1]);
      let shares = 0, reward = 0, claimed = 0, claimable = 0, lp = 0, lpTime = 0, vestPct = 0;
      for (let i = 0; i < len; i++) {
        const e = w.slice(2 + i * 6, 2 + i * 6 + 6);
        const t = Number(e[0]), sh = Number(e[1]);
        const lpv = Number(e[2]) / 1e18, rw = Number(e[3]) / 1e18, cl = Number(e[4]) / 1e18;
        const lpOut = e[5] !== 0n;
        const elapsed = Math.min(Math.max(now - t, 0), LOCK_SEC);
        const vested = rw * elapsed / LOCK_SEC;
        shares += sh; reward += rw; claimed += cl;
        claimable += Math.max(vested - cl, 0);
        if (!lpOut) { lp += lpv; lpTime = Math.max(lpTime, t + LOCK_SEC); }
        vestPct = rw > 0 ? elapsed / LOCK_SEC * 100 : 0;
      }
      totReward += reward; totClaimable += claimable; totShares += shares;
      const usd = v => price != null ? `<span class="usd">≈ ${fmtUSD(v * price)}（到手 ${fmtUSD(v * price * 0.98)}）</span>` : "";
      blocks.push(`<div class="bacct">
        <div class="bhead"><span class="bname">${a.name}</span><span class="bshares">B ${shares} 份 · ${len} 个仓位</span></div>
        <div class="brow"><span>锁定奖励</span><span><b>${fmtAGC(reward)} AGC</b>${usd(reward)}</span></div>
        <div class="brow"><span>现在可领</span><span><b>${fmtAGC(claimable)} AGC</b>${usd(claimable)}</span></div>
        <div class="brow"><span>已领奖励</span><span><b>${fmtAGC(claimed)} AGC</b></span></div>
        <div class="bbar"><i style="width:${vestPct.toFixed(1)}%"></i></div>
        <div class="brow"><span>解锁进度</span><span><b>${vestPct.toFixed(1)}%</b></span></div>
        <div class="brow"><span>LP（14 天后可取）</span><span><b>${lp.toFixed(2)} LP</b>${lpTime ? `<span class="usd">${fmtDT(lpTime)} 起</span>` : ""}</span></div>
      </div>`);
    }
    const totUsd = price != null ? ` · 现价净值 ≈ ${fmtUSD(totClaimable * price * 0.98)}（可领部分到手）` : "";
    sec.innerHTML = `<div class="btot">合计 B ${totShares} 份 · 锁定奖励 <b>${fmtAGC(totReward)} AGC</b> · 现在可领 <b>${fmtAGC(totClaimable)} AGC</b>${totUsd}</div>` + blocks.join("");
  } catch (e) {
    sec.innerHTML = '<div class="bacct"><span class="err">B 仓位链上读取失败，稍后自动重试</span></div>';
  }
}
document.getElementById("custom").addEventListener("input", render);
window.addEventListener("resize", drawChart);
load();
setInterval(load, 30000);
setTimeout(loadB, 1500);
setInterval(loadB, 60000);
</script>
</body>
</html>
